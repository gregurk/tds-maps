name: rebuild map index

on:
  push:
    branches: [main]
    paths: ["maps/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the index from maps/
        run: python build_index.py
      - name: commit the index
        run: |
          if git diff --quiet -- index.json; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild map index"
          git push
      # Runs after the commit: good maps are published even when one upload
      # is broken, and the broken one turns this run red with the reason.
      - name: fail if any upload was rejected
        run: python build_index.py --check
